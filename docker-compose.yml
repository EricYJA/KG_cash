services:
  rog:
    build:
      context: ./docker/rog
      dockerfile: Dockerfile
      # Host netns so RUN steps can reach systemd-resolved's 127.0.0.53 stub;
      # the daemon's default DNS (8.8.8.8) is blocked on this network.
      network: host
    image: kgcash/rog:latest
    container_name: kgcash-rog
    restart: unless-stopped
    # Host netns: this box has net.ipv4.ip_forward=0, so bridged containers have
    # no outbound route and HuggingFace downloads fail with ENETUNREACH. Serves
    # on the host's :8080 directly, so no `ports:` mapping is needed.
    network_mode: host
    env_file:
      - .env
    environment:
      MODEL_ID: rmanluo/RoG
      QUANTIZATION: 8bit
      PORT: 8080
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: kgcash-virtuoso
    restart: unless-stopped
    ports:
      - "8890:8890"
      - "1111:1111"
    environment:
      DBA_PASSWORD: ${VIRTUOSO_DBA_PASSWORD:-dba}
      VIRT_Parameters_NumberOfBuffers: ${VIRTUOSO_BUFFERS:-680000}
      VIRT_Parameters_MaxDirtyBuffers: ${VIRTUOSO_MAX_DIRTY_BUFFERS:-500000}
      VIRT_Parameters_ServerThreads: "20"
      VIRT_Parameters_DirsAllowed: ". , ../vad , /data"
      VIRT_HTTPServer_ServerPort: "8890"
    volumes:
      - virtuoso-db:/database
      - ./datasets/Freebase:/data:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8890/sparql?query=ASK%20%7B%7D || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Alternative SPARQL backend for the same Freebase KG (see docker/oxigraph/).
  # Point clients at it with SPARQL_ENDPOINT=http://localhost:7878/query or
  # KG_BACKEND=oxigraph for the scripts/run_tog_*.py runners.
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    container_name: kgcash-oxigraph
    restart: unless-stopped
    # --union-default-graph makes un-GRAPHed queries search named graphs too,
    # matching Virtuoso's default behavior.
    command: serve --location /db --bind 0.0.0.0:7878 --union-default-graph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph-db:/db
      - ./datasets/Freebase:/data:ro

volumes:
  virtuoso-db:
  oxigraph-db:
